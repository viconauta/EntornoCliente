<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club deportivo</title>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><button id="socios">Socios</button></li>
                <li><button id="servicios">Servicios</button></li>
                <li><button id="testimonios">Testimonios</button></li>
                <li><button id="noticias">Noticias</button></li>
                <li><button id="citas">Citas</button></li>
            </ul>
        </nav>
    </header>
    <main>
        <div>
            <h1>Formulario Club Deportivo</h1>
        </div>
        <div class="socios">
            <form action="./formulario.php" method="post">
                <fieldset>
                    <legend>Formulario de socios</legend>
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" name="nombre" minlength="4" maxlength="50" placeholder="Pepito Perez Perez" required>

                    <label for="usuario">Usuario</label>
                    <input type="text" name="usuario" id="usuario" minlength="5" maxlength="20" required>

                    <label for="email">Correo electronico</label>
                    <input type="email" name="email" id="email" placeholder="tu-email@gmail.com" required>

                    <label for="edad">Edad</label>
                    <input type="number" name="edad" id="edad" min="18" max="100">

                    <input type="radio" name="modalidad" value="mensual" require>
                    <label for="modalidad">Modalidad mensual</label>
                    <input type="radio" name="modalidad" value="anual" require>
                    <label for="modalidad">Modalidad anual</label>

                    <label for="contraseña">Contraseña</label>
                    <input type="password" name="contraseña" id="contraseña" minlength="8" maxlength="16" placeholder="contraseña-123#" required>

                    <label for="confirmacion">Confirma tu contraseña</label>
                    <input type="password" name="confirmacion" id="confirmacion" minlength="8" maxlength="16" placeholder="contraseña-123#" required>

                    <label for="telefono">Numero de telefono</label>
                    <input type="tel" name="telefono" id="telefono" placeholder="678253515" required>

                    <label for="foto">Foto de perfil</label>
                    <input type="file" name="foto" id="foto" accept="image/jpeg" required>

                    <input type="checkbox" name="condiciones" id="condiciones" value="aceptadas">
                    <label for="condiciones">Acepta las condiciones de usuario para continuar</label>

                    <button type="button">Enviar formulario de socio</button>
                </fieldset>
            </form>
        </div>
        <div class="servicios">
            <form action="./formulario.php" method="post">
                <fieldset>
                    <legend>Servicios</legend>
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" minlength="3" maxlength="50" placeholder="Pepito" required>
    
                    <label for="duracion">Edad</label>
                    <input type="number" name="duracion" id="duracion" min="15">
    
                    <label for="precio">Precio</label>
                    <input type="number" name="precio" id="precio" min="0" max="9999.99">
    
                    <label for="categoria">Categoria</label>
                    <select name="categoria" required>
                        <option value="" selected>Seleccionar categoria</option>
                        <option value="taquillas">Taquillas</option>
                        <option value="masaje">Masaje</option>
                        <option value="piscina">Piscina</option>
                    </select>

                    <button type="button">Enviar formulario de servicios</button>
                </fieldset>
            </form>
        </div>
        <div class="testimonios">
            <form action="./formulario.php" method="post">
                <fieldset>
                    <legend>Testimonios</legend>
                    <label for="autor">Autor</label>
                    <input type="text" name="autor" id="autor" minlength="2" maxlength="50" required>
    
                    <label for="testimonio">Testimonio</label>
                    <textarea name="testimonio" id="testimonio" cols="40" rows="4" minlength="10" maxlength="500" placeholder="Escribe aqui tu testimonio" required></textarea>

                    <input type="checkbox" name="autorizacion" id="autorizacion">
                    <label for="autorizacion">Autorizo su publicacion</label>

                    <button type="button">Enviar testimonio</button>
                </fieldset>
            </form>
        </div>
        <div class="noticias">
            <form action="./formulario.php" method="post">
                <fieldset>
                    <legend>Noticias</legend>
                    <label for="titulo">Titulo</label>
                    <input type="text" name="titulo" id="titulo" minlength="3" maxlength="100" required>
        
                    <label for="contenido">Contenido</label>
                    <textarea name="contenido" id="contendio" cols="40" rows="4" minlength="20" maxlength="2000" placeholder="Escribe aqui tu noticia"></textarea>

                    <label for="fecha">Fecha de publicacion</label>
                    <input type="date" name="fecha" id="fecha" required>

                    <label for="imagen">Imagen</label>
                    <input type="file" name="imagen" id="imagen" accept="image/jpeg" required>

                    <button type="button">Enviar noticia</button>
                </fieldset>
            </form>
        </div>
        <div class="citas">
            <form action="./formulario.php" method="post">
                <fieldset>
                    <legend>Citas</legend>
                    <label for="socio">Socio</label>
                    <select name="socio" id="socio">
                        <option value="" selected>Selecciona un socio</option>
                        <option value="Pepito Perez Perez">Pepito Perez Perez</option>
                        <option value="Pablon Pablito Clavo">Pablon Pablito Clavo</option>
                        <option value="Luisa Perez Perez">Luisa Perez Perez</option>
                    </select>

                    <label for="servicio">Servicio</label>
                    <select name="servicio" id="servicio">
                        <option value="" selected>Selecciona un servicio</option>
                        <option value="Gimnasio">Gimnasio</option>
                        <option value="piscina">Piscina</option>
                        <option value="spinnig">Spinning</option>
                    </select>

                    <label for="fecha-hora">Fecha y hora</label>
                    <input type="datetime-local" name="fecha-hora" id="fecha-hora" required>

                    <input type="checkbox" name="confirmacion" id="confirmacion" required>
                    <label for="confirmacion">He revisado los datos de la cita</label>

                    <button type="button">Finalizar</button>
                </fieldset>
            </form>
        </div>
    </main>
</body>
</html>
